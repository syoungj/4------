<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f5f6f8">
    <title>4대보험 계산기 - 국민노무법인</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 로고 및 헤더 -->
    <header>
        <div class="logo-container">
            <h1>4대보험 계산기</h1>
        </div>
    </header>

    <!-- 1단계: 급여 입력 -->
    <div id="step1" class="step active">
        <div class="card">
            <h2>급여를 입력해주세요</h2>

            <div class="input-group">
                <label for="salary">월급여액</label>
                <input type="number" id="salary" inputmode="numeric" placeholder="예: 3000000">
                <span class="unit">원</span>
            </div>

            <button class="btn-primary" onclick="goToStep2()">다음</button>
        </div>
    </div>

    <!-- 2단계: 딱 하나만 선택 -->
    <div id="step2" class="step">
        <div class="card">
            <h2>무엇이 궁금하세요?</h2>

            <button class="btn-option" onclick="selectPath('worker')">
                <div class="option-title">내 월급에서 얼마 떼나요?</div>
                <div class="option-desc">실제로 받는 금액을 확인해요</div>
            </button>

            <button class="btn-option" onclick="selectPath('employer')">
                <div class="option-title">직원 채용하면 제가 얼마 내나요?</div>
                <div class="option-desc">사업주가 실제로 부담하는 총 금액이에요</div>
            </button>

            <button class="btn-secondary" onclick="goToStep1()">이전</button>
        </div>

        <div class="expert-entry">
            <a href="#" onclick="goToExpert(); return false;">전문가용으로 보기</a>
        </div>
    </div>

    <!-- 3단계: 결과 화면 (다음 단계에서 개발 예정) -->
    <div id="step3" class="step">
        <div class="card">
            <h2>결과 화면 준비 중</h2>
            <p class="placeholder-text">여기에 실수령액 · 사업주 총 부담액과<br>두루누리 · 일부가입 토글이 들어갈 예정입니다.</p>
            <button class="btn-secondary" onclick="goToStep2()">이전</button>
        </div>
    </div>

    <!-- 푸터 -->
    <footer>
        <p>이 계산기는 국민노무법인에서 제공합니다</p>
        <p class="note">※ 2026년 요율 기준 (고용보험 2025년)</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
